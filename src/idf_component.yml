## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true

  h2zero/esp-nimble-cpp: ^2.3.4
  espressif/mdns: "^1.2"
  joltwallet/littlefs: "^1.14"

  # Pinned to a fork, for two reasons.
  #
  # `version: main` upstream now resolves to 0.2.2, which renamed every
  # WIFI_CFG_EVT_* event to WIFI_CFG_EVENT_* and moved from esp_bus to esp_event.
  # wifi_setup.cpp subscribes to seven of those by their old names, so a clean
  # checkout would simply stop compiling - a moving branch was never a safe pin.
  #
  # The fork is upstream 1764ce4 (0.1.0) verbatim, plus one commit making the
  # station config ask for the STRONGEST matching access point instead of the
  # first one heard. Upstream still defaults to WIFI_FAST_SCAN with no RSSI
  # floor, which on a network where a repeater shares the SSID decides the
  # association by scan order: three consecutive boots here associated at -84,
  # -86 and -50 dBm without the device moving. See src/wifi_link.cpp.
  thorrak/esp_wifi_config:
    git: https://github.com/tonci22/esp_wifi_config.git
    version: 29c2678f214821f64791dadab44bc8112eea57f4
  # thorrak/esp_bus: "^1.0.3"
